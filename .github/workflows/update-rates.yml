          print(f"Resultado final -> USD: {bcv_usd}, EUR: {bcv_eur}, Estado: {source_status}")
          PYEOF

      - name: Commit y push rates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/rates.json
          git diff --staged --quiet || git commit -m "chore: actualizar tasas BCV directo $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
