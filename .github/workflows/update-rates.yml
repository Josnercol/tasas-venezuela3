name: Actualizar Tasas BCV

on:
  schedule:
    - cron: '*/30 * * * *'  # Cada 30 minutos
  workflow_dispatch:          # También se puede correr manualmente

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Scrapear BCV
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import json
          import re
          import ssl
          from datetime import datetime, timezone

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          req = urllib.request.Request(
            'https://www.bcv.org.ve/',
            headers={
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Accept-Language': 'es-ES,es;q=0.9',
              'Cache-Control': 'no-cache',
            }
          )

          try:
            with urllib.request.urlopen(req, context=ctx, timeout=20) as res:
              html = res.read().decode('utf-8', errors='replace')
          except Exception as e:
            print(f"Error cargando pagina BCV: {e}")
            html = ""

          def parse_rate(currency_id):
            if not html:
              return None
            # Busca la sección donde está el div de la moneda (dolar / euro)
            pattern = rf'id="{currency_id}".*?<strong>\s*([\d.,]+)\s*</strong>'
            match = re.search(pattern, html, re.DOTALL | re.IGNORECASE)
            if match:
              raw_val = match.group(1).strip()
              val = float(raw_val.replace('.', '').replace(',', '.'))
              return round(val, 2)
            return None

          bcv_usd = parse_rate('dolar')
          bcv_eur = parse_rate('euro')

          print(f"Resultado scraping -> USD: {bcv_usd}, EUR: {bcv_eur}")

          rates = {
            'bcv_usd': bcv_usd,
            'bcv_eur': bcv_eur,
            'source': 'bcv_direct' if bcv_usd else 'error',
            'timestamp': datetime.now(timezone.utc).isoformat()
          }

          with open('public/rates.json', 'w') as f:
            json.dump(rates, f, indent=2)

          print(f"Guardado en rates.json correctamente.")
          PYEOF

      - name: Commit y push rates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/rates.json
          git diff --staged --quiet || git commit -m "chore: actualizar tasas BCV $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
